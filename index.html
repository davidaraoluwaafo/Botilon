<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botilon</title>
    <!-- Dynamic Clerk Browser SDK Integration Tooling -->
    <script async crossorigin="anonymous" data-clerk-publishable-key="{{ clerk_publishable_key }}" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js" type="text/javascript"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .screen {
            width: 100%;
            max-width: 680px;
            height: 92vh;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }

        .hidden { display: none !important; }

        /* ── HOME HEADER ── */
        .home-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .home-logo-area {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .home-logo-area img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(139,92,246,0.5);
        }

        .home-logo-area h1 { color: #fff; font-size: 17px; font-weight: 700; }

        /* Unified widget container to cleanly align dynamic profile structures */
        .auth-widget-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 7px 14px;
            cursor: pointer;
            transition: background 0.2s;
            max-width: 160px;
        }

        .username-pill:hover { background: rgba(255,255,255,0.13); }

        .username-pill span {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── HOME BODY ── */
        .home-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* sidebar */
        .sidebar {
            width: 210px;
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            padding: 14px 10px;
            gap: 10px;
            flex-shrink: 0;
        }

        .add-chat-btn {
            width: 100%;
            padding: 9px 12px;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .add-chat-btn:hover { opacity: 0.85; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chat-list::-webkit-scrollbar { width: 3px; }
        .chat-list::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 3px; }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 9px;
            border-radius: 9px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.15s;
        }

        .chat-item:hover { background: rgba(255,255,255,0.07); }

        .chat-item.active {
            background: rgba(139,92,246,0.18);
            border-color: rgba(139,92,246,0.35);
        }

        .chat-icon { font-size: 13px; flex-shrink: 0; }

        .chat-name {
            flex: 1;
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item.active .chat-name { color: #fff; }

        .chat-actions { display: none; gap: 2px; }
        .chat-item:hover .chat-actions { display: flex; }

        .icon-btn {
            width: 22px;
            height: 22px;
            border-radius: 50px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .icon-btn.del:hover { background: rgba(239,68,68,0.2); color: #fca5a5; }

        /* center area */
        .home-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
        }

        .home-center img {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(139,92,246,0.5);
            box-shadow: 0 0 30px rgba(139,92,246,0.3);
        }

        .home-center p {
            color: rgba(255,255,255,0.45);
            font-size: 14px;
            text-align: center;
        }

        .continue-btn {
            padding: 13px 34px;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(124,58,237,0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .continue-btn:hover { transform: scale(1.04); box-shadow: 0 8px 28px rgba(124,58,237,0.55); }
        .continue-btn:active { transform: scale(0.97); }

        /* ── CHAT HEADER ── */
        .chat-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(139,92,246,0.5);
            box-shadow: 0 0 14px rgba(139,92,246,0.3);
        }

        .header-info h1 { color: #fff; font-size: 17px; font-weight: 700; }

        .header-info p {
            color: rgba(255,255,255,0.45);
            font-size: 11px;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .header-btns { margin-left: auto; display: flex; gap: 8px; align-items: center; }

        .pill-btn {
            padding: 7px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 50px;
            color: rgba(255,255,255,0.75);
            font-size: 12.5px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .pill-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
    </style>
    <style>
        .auth-link {
            color: #ddd6fe;
            font-size: 12px;
            text-decoration: none;
            border: 1px solid rgba(196,181,253,.35);
            border-radius: 50px;
            padding: 7px 12px;
        }
        .auth-link:hover { background: rgba(139,92,246,.2); color: #fff; }
        .username-pill {
            border: 1px solid rgba(196,181,253,.35);
            color: #fff;
            font-family: inherit;
        }
        .chat-header { padding: 16px 20px; background: rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:12px; flex-shrink:0; }
        .header-logo { width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid rgba(139,92,246,.5); }
        .header-info h1 { color:#fff; font-size:17px; }
        .header-info p { color:rgba(255,255,255,.45); font-size:11px; margin-top:3px; }
        .online-dot { display:inline-block; width:6px; height:6px; margin-right:5px; border-radius:50%; background:#22c55e; }
        .header-btns { margin-left:auto; display:flex; gap:8px; }
        .pill-btn { padding:7px 12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:50px; color:rgba(255,255,255,.78); font-size:12px; cursor:pointer; }
        .pill-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
        .pill-btn.danger:hover { background:rgba(239,68,68,.2); color:#fecaca; }
        .messages { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:10px; }
        .message { display:flex; align-items:flex-end; gap:8px; animation:fadeUp .25s ease; }
        .message.user { flex-direction:row-reverse; }
        .msg-avatar, .user-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; }
        .msg-avatar { object-fit:cover; }
        .user-avatar { display:grid; place-items:center; background:linear-gradient(135deg,#6366f1,#8b5cf6); font-size:12px; }
        .bubble { max-width:74%; padding:10px 14px; color:#eee8ff; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.09); border-radius:4px 16px 16px 16px; }
        .message.user .bubble { color:#fff; background:linear-gradient(135deg,#7c3aed,#6366f1); border:0; border-radius:16px 4px 16px 16px; }
        .typing { display:none; align-items:flex-end; gap:8px; padding:0 16px 8px; }
        .typing.visible { display:flex; }
        .typing-dots { padding:11px 15px; display:flex; gap:5px; border-radius:4px 16px 16px 16px; background:rgba(255,255,255,.09); }
        .typing-dots span { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.45); animation:bounce 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:.18s; }
        .typing-dots span:nth-child(3) { animation-delay:.36s; }
        .input-area { padding:12px 16px; display:flex; gap:10px; background:rgba(255,255,255,.04); border-top:1px solid rgba(255,255,255,.08); }
        .input-area input { flex:1; min-width:0; padding:12px 17px; color:#fff; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:50px; outline:none; font-size:14px; }
        .input-area input:focus { border-color:rgba(139,92,246,.65); }
        .input-area input::placeholder { color:rgba(255,255,255,.3); }
        .send-btn { width:42px; height:42px; border:0; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#6366f1); color:#fff; cursor:pointer; font-size:18px; }
        .send-btn:disabled { opacity:.45; cursor:wait; }
        .overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:rgba(0,0,0,.62); }
        .modal { width:min(320px,calc(100vw - 32px)); padding:24px; border:1px solid rgba(255,255,255,.12); border-radius:16px; background:#1a1733; }
        .modal h3 { margin-bottom:14px; color:#fff; font-size:16px; }
        .modal input { width:100%; padding:11px 13px; margin-bottom:14px; color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:9px; outline:none; }
        .modal-btns { display:flex; justify-content:flex-end; gap:8px; }
        .modal-btns button { padding:8px 16px; border:0; border-radius:8px; cursor:pointer; }
        .btn-cancel { color:rgba(255,255,255,.7); background:rgba(255,255,255,.09); }
        .btn-save { color:#fff; background:linear-gradient(135deg,#7c3aed,#6366f1); }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-5px); } }
        @media (max-width:560px) {
            body { padding:0; }
            .screen { height:100vh; max-width:none; border-radius:0; }
            .sidebar { width:145px; }
            .header-btns { gap:4px; }
            .pill-btn { padding:7px 9px; font-size:11px; }
            .bubble { max-width:82%; }
        }
    </style>
</head>
<body>
    <div class="screen" id="homeScreen">
        <header class="home-header">
            <div class="home-logo-area"><img src="/logo" alt="Botilon Logo"><h1>Botilon</h1></div>
            <div class="auth-widget-wrapper">
                {% if is_guest %}
                <a class="auth-link" href="/sign-in?next=/chatbot">Sign in</a>
                <a class="auth-link" href="/sign-up?next=/chatbot">Create account</a>
                {% else %}
                <button class="username-pill" type="button" onclick="openUsernameModal()" title="Change your username">
                    <span id="usernameDisplay">User</span>
                    <span aria-hidden="true">✎</span>
                </button>
                {% endif %}
            </div>
        </header>
        <div class="home-body">
            <aside class="sidebar">
                <button class="add-chat-btn" onclick="addNewChat()"><span>+</span> New Chat</button>
                <div class="chat-list" id="chatList"></div>
            </aside>
            <main class="home-center">
                <img src="/logo" alt="Botilon">
                <p>Select a chat or start a new one</p>
                <button class="continue-btn" onclick="continueCurrent()">Continue Chat</button>
            </main>
        </div>
    </div>

    <div class="screen hidden" id="chatScreen">
        <header class="chat-header">
            <img src="/logo" alt="Botilon" class="header-logo">
            <div class="header-info"><h1>Botilon</h1><p><span class="online-dot"></span>Online · Your AI chatbot</p></div>
            <div class="header-btns">
                <button class="pill-btn danger" onclick="restartCurrentChat()">Restart</button>
                <button class="pill-btn" onclick="goHome()">Home</button>
            </div>
        </header>
        <div class="messages" id="messages"></div>
        <div class="typing" id="typing"><img src="/logo" alt="" class="msg-avatar"><div class="typing-dots"><span></span><span></span><span></span></div></div>
        <div class="input-area">
            <input id="userInput" type="text" placeholder="Type a message..." autocomplete="off">
            <button class="send-btn" id="sendButton" onclick="sendMessage()" aria-label="Send message">➤</button>
        </div>
    </div>

    <div class="overlay hidden" id="renameModal" onclick="if(event.target===this)closeRenameModal()">
        <div class="modal"><h3>Rename Chat</h3><input id="renameInput" maxlength="30" placeholder="Chat name..."><div class="modal-btns"><button class="btn-cancel" onclick="closeRenameModal()">Cancel</button><button class="btn-save" onclick="saveRename()">Save</button></div></div>
    </div>
    <div class="overlay hidden" id="usernameModal" onclick="if(event.target===this)closeUsernameModal()">
        <div class="modal"><h3>Change Username</h3><input id="usernameInput" maxlength="24" placeholder="Enter your name..."><div class="modal-btns"><button class="btn-cancel" onclick="closeUsernameModal()">Cancel</button><button class="btn-save" onclick="saveUsername()">Save</button></div></div>
    </div>

    <script>
        const isGuest = {{ is_guest|tojson }};
        const KEY = 'botilon_v2';
        const defaults = () => ({ username: 'User', currentChatId: null, chats: [] });
        function loadStore() { try { return JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch { return defaults(); } }
        let store = loadStore(), typing = false, renamingId = null;
        const messages = document.getElementById('messages');
        const input = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const typingEl = document.getElementById('typing');
        const chat = id => store.chats.find(item => item.id === id);
        const save = () => localStorage.setItem(KEY, JSON.stringify(store));

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            store.chats.forEach(item => {
                const row = document.createElement('div');
                row.className = 'chat-item' + (item.id === store.currentChatId ? ' active' : '');
                row.onclick = () => openChat(item.id);
                const icon = document.createElement('span'); icon.className = 'chat-icon'; icon.textContent = '💬';
                const name = document.createElement('span'); name.className = 'chat-name'; name.textContent = item.name;
                const actions = document.createElement('div'); actions.className = 'chat-actions';
                const rename = document.createElement('button'); rename.className = 'icon-btn'; rename.title = 'Rename'; rename.textContent = '✎';
                rename.onclick = e => { e.stopPropagation(); openRenameModal(item.id); };
                const del = document.createElement('button'); del.className = 'icon-btn del'; del.title = 'Delete'; del.textContent = '×';
                del.onclick = e => { e.stopPropagation(); deleteChat(item.id); };
                actions.append(rename, del); row.append(icon, name, actions); list.appendChild(row);
            });
        }

        async function addNewChat() {
            const id = 'c_' + Date.now();
            store.chats.push({ id, name: `Chat ${store.chats.length + 1}`, messages: [], botState: { state: 'greeting' } });
            store.currentChatId = id; save(); renderChatList(); await openChat(id);
        }
        async function continueCurrent() {
            if (store.currentChatId && chat(store.currentChatId)) await openChat(store.currentChatId);
            else await addNewChat();
        }
        async function openChat(id) {
            store.currentChatId = id; save(); renderChatList();
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            messages.innerHTML = '';
            const item = chat(id);
            if (item.messages.length) item.messages.forEach(m => appendMsg(m.text, m.sender, false));
            else await startSession();
            input.focus();
        }
        function goHome() { persistMessages(); document.getElementById('chatScreen').classList.add('hidden'); document.getElementById('homeScreen').classList.remove('hidden'); renderChatList(); }
        function deleteChat(id) {
            if (!window.confirm('Delete this chat?')) return;
            store.chats = store.chats.filter(item => item.id !== id);
            if (store.currentChatId === id) store.currentChatId = store.chats.length ? store.chats[store.chats.length - 1].id : null;
            save(); renderChatList();
            if (!store.currentChatId) goHome();
        }
        function persistMessages() {
            const item = chat(store.currentChatId); if (!item) return;
            item.messages = [...messages.querySelectorAll('.message')].map(el => ({ text: el.querySelector('.bubble').textContent, sender: el.classList.contains('user') ? 'user' : 'bot' }));
            save();
        }
        function openRenameModal(id) { renamingId = id; document.getElementById('renameInput').value = chat(id).name; document.getElementById('renameModal').classList.remove('hidden'); document.getElementById('renameInput').focus(); }
        function closeRenameModal() { document.getElementById('renameModal').classList.add('hidden'); renamingId = null; }
        function saveRename() { const value = document.getElementById('renameInput').value.trim(); if (value && renamingId) { chat(renamingId).name = value; save(); } closeRenameModal(); renderChatList(); }
        function openUsernameModal() { document.getElementById('usernameInput').value = store.username; document.getElementById('usernameModal').classList.remove('hidden'); }
        function closeUsernameModal() { document.getElementById('usernameModal').classList.add('hidden'); }
        function renderUsername() {
            const display = document.getElementById('usernameDisplay');
            if (display) display.textContent = store.username || 'User';
        }
        function saveUsername() {
            const value = document.getElementById('usernameInput').value.trim();
            if (value) { store.username = value; save(); renderUsername(); }
            closeUsernameModal();
        }
        function appendMsg(text, sender, animate = true) {
            const row = document.createElement('div'); row.className = `message ${sender}`; if (!animate) row.style.animation = 'none';
            if (sender === 'bot') { const avatar = document.createElement('img'); avatar.src = '/logo'; avatar.className = 'msg-avatar'; avatar.alt = 'Botilon'; row.appendChild(avatar); }
            else { const avatar = document.createElement('div'); avatar.className = 'user-avatar'; avatar.textContent = '👤'; row.appendChild(avatar); }
            const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text; row.appendChild(bubble); messages.appendChild(row); messages.scrollTop = messages.scrollHeight;
        }
        function showTyping() { typingEl.classList.add('visible'); messages.scrollTop = messages.scrollHeight; }
        function hideTyping() { typingEl.classList.remove('visible'); }
        async function deliver(items) {
            for (const text of items || []) { if (!text) continue; showTyping(); await new Promise(resolve => setTimeout(resolve, Math.min(300 + text.length * 4, 680))); hideTyping(); appendMsg(text, 'bot'); }
        }
        async function startSession() {
            typing = true; input.disabled = true; sendButton.disabled = true;
            try {
                const result = await fetch('/start'); const data = await result.json(); const item = chat(store.currentChatId);
                if (item) { item.botState = data.bot_state || { state: 'greeting' }; save(); }
                await deliver(data.messages); persistMessages();
            } finally { typing = false; input.disabled = false; sendButton.disabled = false; input.focus(); }
        }
        async function sendMessage() {
            const text = input.value.trim(); if (!text || typing) return;
            input.value = ''; appendMsg(text, 'user'); persistMessages(); typing = true; input.disabled = true; sendButton.disabled = true;
            const item = chat(store.currentChatId);
            try {
                const result = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ message:text, bot_state:item ? item.botState : { state:'greeting' } }) });
                if (!result.ok) throw new Error('Chat request failed');
                const data = await result.json(); if (item) { item.botState = data.bot_state || item.botState; save(); }
                await deliver(data.messages || data.responses); persistMessages();
            } catch { hideTyping(); appendMsg('Oops! Something went wrong. Please try again.', 'bot'); }
            finally { typing = false; input.disabled = false; sendButton.disabled = false; input.focus(); }
        }
        async function restartCurrentChat() { const item = chat(store.currentChatId); if (!item) return; item.messages = []; item.botState = { state:'greeting' }; save(); messages.innerHTML = ''; await startSession(); }
        input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        document.getElementById('renameInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveRename(); });
        document.getElementById('usernameInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveUsername(); });
        renderUsername();
        renderChatList();
    </script>
</body>
</html>
