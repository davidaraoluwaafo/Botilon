<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#110d2a">
    <link rel="icon" href="/favicon.ico">
    <title>{{ "Sign in" if mode == "sign-in" else "Create account" }} · Botilon</title>
    <style>
        :root {
            color-scheme: dark;
            --purple: #8b5cf6;
            --indigo: #6366f1;
            --paper: #f8f7ff;
            --muted: rgba(248, 247, 255, .64);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background:
                radial-gradient(circle at 50% 14%, rgba(99, 102, 241, .22), transparent 25rem),
                linear-gradient(135deg, #0f0c29, #302b63 55%, #24243e);
            color: var(--paper);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .shell { width: min(100%, 460px); text-align: center; }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: .65rem;
            margin-bottom: 1.25rem;
            color: var(--paper);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -.04em;
        }
        .brand img {
            width: 38px;
            height: 38px;
            border: 2px solid rgba(196, 181, 253, .55);
            border-radius: 11px;
            object-fit: cover;
        }
        .intro { margin: 0 0 1.2rem; color: var(--muted); font-size: .9rem; }
        #clerk-auth {
            min-height: 420px;
            display: flex;
            justify-content: center;
        }
        .fallback { color: var(--muted); font-size: .85rem; }
        .fallback a { color: #c4b5fd; }
    </style>
</head>
<body>
    <main class="shell">
        <div class="brand"><img src="/logo" alt="Botilon logo">Botilon</div>
        <p class="intro">{{ "Sign in to continue chatting with Botilon." if mode == "sign-in" else "Create your account to start chatting with Botilon." }}</p>
        <div id="clerk-auth" aria-live="polite"></div>
        <p id="fallback" class="fallback">Loading secure sign-in…</p>
        <p class="fallback">
            {% if mode == "sign-in" %}
            Need an account? <a href="/sign-up?next={{ next_url|urlencode }}">Create one</a>
            {% else %}
            Already have an account? <a href="/sign-in?next={{ next_url|urlencode }}">Sign in</a>
            {% endif %}
        </p>
    </main>
    <script>
        const publishableKey = {{ clerk_publishable_key|tojson }};
        const nextUrl = {{ next_url|tojson }};
        const mode = {{ mode|tojson }};
        const fallback = document.getElementById('fallback');

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
        script.async = true;
        script.crossOrigin = 'anonymous';
        script.setAttribute('data-clerk-publishable-key', publishableKey);
        script.onload = async () => {
            try {
                const clerk = window.Clerk;
                if (!clerk) throw new Error('Clerk SDK did not initialize.');
                await clerk.load();

                // If user is already signed in, immediately forward them past the gate
                if (clerk.user) {
                    window.location.replace(nextUrl);
                    return;
                }

                fallback.style.display = 'none';
                const mount = mode === 'sign-up' ? clerk.mountSignUp : clerk.mountSignIn;
                mount.call(clerk, document.getElementById('clerk-auth'), {
                    routing: 'path',
                    path: `/${mode}`,
                    fallbackRedirectUrl: nextUrl,
                    signInUrl: '/sign-in',
                    signUpUrl: '/sign-up'
                });
            } catch (error) {
                console.error('Unable to load authentication:', error);
                fallback.textContent = 'Secure sign-in could not load. Please refresh and try again.';
            }
        };
        script.onerror = () => {
            fallback.textContent = 'Secure sign-in could not load. Please refresh and try again.';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
